# ============================================================
# 场景 1：信用卡最低还款陷阱
# ============================================================
- id: "debt-credit-card-min-payment"
  name:
    cn: "信用卡最低还款陷阱"
    en: "Credit Card Minimum Payment Trap"
  audience:
    cn: ["信用卡持有者", "月光族", "负债人群"]
    en: ["Credit card holders", "Paycheck-to-paycheck", "Debtors"]
  age_range: "22-45岁"
  scenario_domain: "负债与债务"
  scenario_type: "危机应对"
  pain_point:
    cn: "以为每月还一点总能还清，实际在给银行打工"
    en: "Think paying a little monthly will clear it, but you're working for the bank"
  trigger_moment:
    cn: "收到信用卡账单，发现还不上全款"
    en: "Receive credit card statement, can't pay in full"
  life_stage: "就业期"
  life_event: "刷卡消费后无法全额还款"
  time_window: "每月账单日"
  dimensions:
    count: 2
    dim1: { name: { cn: "欠款金额", en: "Debt Balance" }, role: "输入" }
    dim2: { name: { cn: "年利率", en: "Annual Rate" }, role: "输入" }
  output:
    type: "年限+金额"
    format: { cn: "还清所需年限 + 总利息", en: "Years to payoff + Total interest" }
    decision_rule: "年限>30年 或 还不清 → 危险"
  model:
    type: "复利迭代"
    formula: "minimum_payment_payoff"
    assumptions:
      cn: "最低还款=余额×5%（最低50元）；利息按月复利；无新增消费"
      en: "Min payment = 5% of balance (floor 50); Monthly compounding; No new spending"
  emotion: ["焦虑", "惊醒"]
  hook:
    cn: "5万债务18%利率只还最低 → 30年 + 利息超过本金"
    en: "50K at 18% paying minimum → 30 years + interest exceeds principal"
  priority: "P0"
  bilingual: true
  color_scheme: "traffic_light"

# ============================================================
# 场景 2：应急金
# ============================================================
- id: "cash-emergency-fund"
  name:
    cn: "应急金该留多少"
    en: "How Much Emergency Fund Do You Need"
  audience:
    cn: ["工薪族", "单收入家庭", "自由职业者"]
    en: ["Employees", "Single-income families", "Freelancers"]
  age_range: "22-50岁"
  scenario_domain: "日常现金流"
  scenario_type: "规划决策"
  pain_point:
    cn: "不知道工资卡该留多少救命钱"
    en: "Don't know how much cash to keep as a safety net"
  trigger_moment:
    cn: "换工作、行业动荡、或听说朋友失业"
    en: "Job change, industry turmoil, or hearing a friend got laid off"
  life_stage: "就业期/家庭期"
  life_event: "收入不稳定或家庭责任增加"
  time_window: "换工作前/家庭结构变化时"
  dimensions:
    count: 2
    dim1: { name: { cn: "月固定支出", en: "Monthly Fixed Expenses" }, role: "输入" }
    dim2: { name: { cn: "家庭稳定性", en: "Income Stability" }, role: "输入" }
  output:
    type: "金额+月数"
    format: { cn: "建议应急金 + 覆盖月数", en: "Recommended fund + Months covered" }
    decision_rule: "覆盖3-12个月支出"
  model:
    type: "乘法"
    formula: "emergency_fund"
    assumptions:
      cn: "应急金=月固定支出×覆盖月数；覆盖月数按收入稳定性分档（双职工3月、单职工6月、不稳定9月、自由职业12月）"
      en: "Fund = Monthly expense × Months; Months by stability (dual-income 3, single 6, unstable 9, freelance 12)"
  emotion: ["掌控", "安心"]
  hook:
    cn: "你的安全感，值几个月工资"
    en: "Your sense of security is worth how many months of salary"
  priority: "P1"
  bilingual: true

